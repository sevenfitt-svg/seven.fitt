<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل ورزشکار | Seven.fitt</title>


<style>

*{
box-sizing:border-box;
font-family:tahoma,Arial;
}


body{

margin:0;
background:#081426;
color:white;

}


.container{

max-width:1000px;
margin:auto;
padding:25px;

}



.header{

background:#102b50;
padding:25px;
border-radius:20px;

display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:28px;
font-weight:bold;
color:#22b8ff;

}


.back{

background:#ff4d5a;
padding:10px 20px;
border-radius:10px;
color:white;
text-decoration:none;

}



.card{

background:#102b50;
border:1px solid #244b7a;
border-radius:20px;
padding:25px;
margin-top:25px;

}



.info{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;

}



.box{

background:#172d4d;
padding:20px;
border-radius:15px;
text-align:center;

}



.title{

color:#22b8ff;
font-size:18px;

}



button{

background:#0098df;
color:white;
border:0;
padding:12px 25px;
border-radius:10px;
cursor:pointer;

}



textarea{

width:100%;
height:120px;

background:#172d4d;
color:white;

border:1px solid #315784;

border-radius:10px;

padding:15px;

}


@media(max-width:700px){

.info{

grid-template-columns:1fr;

}

}


</style>


</head>



<body>


<div class="container">


<div class="header">

<div class="logo">
SEVEN.FITT
</div>


<a class="back" href="index.html">
بازگشت
</a>


</div>




<div class="card">


<h2>
پروفایل ورزشکار
</h2>



<div class="info">


<div class="box">

<div class="title">
نام ورزشکار
</div>

<h3 id="name">
-
</h3>

</div>



<div class="box">

<div class="title">
رشته ورزشی
</div>

<h3 id="sport">
-
</h3>

</div>



<div class="box">

<div class="title">
هدف تمرینی
</div>

<h3 id="goal">
-
</h3>

</div>



</div>


</div>






<div class="card">


<h2>
اطلاعات تکمیلی ورزشکار
</h2>



<p>
وضعیت جسمانی، سابقه تمرینی، آسیب‌ها و توضیحات مربی
</p>



<textarea placeholder="اطلاعات ورزشکار را وارد کنید..."></textarea>


<br><br>


<button>
ذخیره اطلاعات
</button>


</div>






<div class="card">


<h2>
برنامه تخصصی رشته ورزشی
</h2>


<p>

ساخت برنامه تمرینی بر اساس رشته ورزشی، هدف و شرایط ورزشکار

</p>



<button>

ساخت برنامه جدید

</button>


</div>




</div>




<script>


let params=new URLSearchParams(window.location.search);



document.getElementById("name").innerHTML =
params.get("name") || "-";


document.getElementById("sport").innerHTML =
params.get("sport") || "-";


document.getElementById("goal").innerHTML =
params.get("goal") || "-";



</script>



</body>

</html>
