<div><label>نام</label><input id="name"></div><div><label>سن</label><input id="age"></div><div><label>جنسیت</label><select id="gender"><option value="مرد">مرد</option><option value="زن">زن</option></select></div><div><label>شماره تماس</label><input id="phone"></div><div><label>رشته ورزشی</label><input id="sport"></div><div><label>سطح ورزشکار</label><input id="level"></div><div><label>هدف تمرینی</label><input id="goal"></div><div><label>قد (سانتی متر)</label><input id="height"></div><div><label>وزن (کیلوگرم)</label><input id="weight"></div><div class="full"><label>سابقه تمرینی</label><textarea id="history"></textarea></div><div class="full"><label>وضعیت سلامت و آسیب</label><textarea id="health"></textarea></div><div class="full"><label>یادداشت مربی</label><textarea id="note"></textarea></div></div><button id="saveBtn">ذخیره تغییرات</button></div></div>
<script>
const id=new URLSearchParams(location.search).get('id'),fields=['name','age','gender','phone','sport','level','goal','height','weight','history','health','note'];const $=x=>document.getElementById(x);$('back').href='profile.html?id='+encodeURIComponent(id||'');function data(){const o={};fields.forEach(k=>o[k]=$(k).value);return o}
async function load(){const a=await SevenFitt.api('/athletes/'+encodeURIComponent(id));fields.forEach(k=>$(k).value=a[k]??'');$('status').textContent='اطلاعات آماده ویرایش است.'}
$('saveBtn').onclick=async()=>{const b=$('saveBtn');b.disabled=true;try{await SevenFitt.api('/athletes/'+encodeURIComponent(id),{method:'PATCH',body:data()});location.href='profile.html?id='+encodeURIComponent(id)}catch(e){$('status').textContent='ذخیره انجام نشد: '+e.message;b.disabled=false}};
(async()=>{try{await SevenFitt.auth.requireCoach('../login.html');if(!id)throw new Error('ATHLETE_ID_REQUIRED');await load()}catch(e){$('status').textContent='خطا: '+e.message}})();
</script></body></html>
