<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت ورزشکاران | Seven.fitt</title>

<style>

*{
box-sizing:border-box;
font-family:tahoma;
}

body{
margin:0;
background:#081426;
color:white;
}


.container{
max-width:1100px;
margin:auto;
padding:25px;
}


.header{
background:#102b50;
padding:20px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
}


.logo{
color:#20b8ff;
font-size:28px;
font-weight:bold;
}


.back{
background:#ff5260;
padding:10px 20px;
border-radius:10px;
color:white;
text-decoration:none;
}



.card{

background:#102b50;
border-radius:20px;
padding:25px;
margin-top:25px;

}



.grid{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;

}



label{

font-size:13px;
color:#9cc8ff;

}


input,select,textarea{

width:100%;
margin-top:8px;
padding:12px;

background:#172f52;
color:white;

border:1px solid #315784;

border-radius:10px;

}



textarea{

height:100px;

}


button{

background:#0098df;
color:white;
border:0;

padding:14px 30px;

border-radius:10px;

cursor:pointer;

margin-top:20px;

}



table{

width:100%;
margin-top:20px;
border-collapse:collapse;

}


td,th{

padding:12px;
border-bottom:1px solid #315784;

}



@media(max-width:700px){

.grid{

grid-template-columns:1fr;

}

}


</style>


</head>



<body>


<div class="container">


<div class="header">

<div class="logo">
SEVEN.FITT
</div>


<a class="back" href="../index.html">
بازگشت
</a>


</div>



<div class="card">


<h2>
ثبت ورزشکار جدید
</h2>


<div class="grid">


<div>
<label>نام و نام خانوادگی</label>
<input id="name">
</div>


<div>
<label>سن</label>
<input id="age">
</div>


<div>
<label>جنسیت</label>

<select id="gender">

<option>مرد</option>
<option>زن</option>

</select>

</div>


<div>
<label>شماره تماس</label>
<input id="phone">

</div>


<div>
<label>رشته ورزشی</label>

<select id="sport">

<option>فوتبال</option>
<option>بدنسازی</option>
<option>رزمی</option>
<option>کشتی</option>
<option>والیبال</option>
<option>بسکتبال</option>
<option>دوومیدانی</option>
<option>شنا</option>
<option>سایر</option>

</select>

</div>



<div>
<label>سطح ورزشکار</label>

<select id="level">

<option>مبتدی</option>
<option>متوسط</option>
<option>پیشرفته</option>
<option>حرفه‌ای</option>

</select>

</div>



<div>
<label>هدف تمرینی</label>

<select id="goal">

<option>افزایش حجم</option>
<option>کاهش چربی</option>
<option>افزایش قدرت</option>
<option>افزایش سرعت و توان</option>
<option>آمادگی مسابقه</option>
<option>بازتوانی</option>

</select>

</div>



<div>
<label>قد (سانتی متر)</label>
<input id="height">

</div>


<div>
<label>وزن (کیلوگرم)</label>
<input id="weight">

</div>



</div>



<h3>سابقه تمرینی</h3>

<textarea id="history"
placeholder="سال‌های تمرین، رشته‌های قبلی، مسابقات..."></textarea>



<h3>وضعیت سلامت و آسیب</h3>

<textarea id="health"
placeholder="بیماری، دارو، محدودیت پزشکی، آسیب فعلی یا قبلی..."></textarea>



<h3>یادداشت مربی</h3>

<textarea id="note"></textarea>



<button onclick="addAthlete()">

+ افزودن ورزشکار

</button>



</div>





<div class="card">


<h2>
لیست ورزشکاران
</h2>


<table>

<thead>

<tr>

<th>نام</th>
<th>رشته</th>
<th>هدف</th>
<th>پروفایل</th>

</tr>

</thead>


<tbody id="list">

</tbody>


</table>


</div>



</div>






<script>


let athletes =
JSON.parse(localStorage.getItem("athletes")) || [];



function addAthlete(){


let athlete={

name:name.value,
age:age.value,
gender:gender.value,
phone:phone.value,

sport:sport.value,
level:level.value,
goal:goal.value,

height:height.value,
weight:weight.value,

history:history.value,
health:health.value,

note:note.value

};



athletes.push(athlete);


localStorage.setItem(
"athletes",
JSON.stringify(athletes)
);



showAthletes();


}





function showAthletes(){


list.innerHTML="";


athletes.forEach((a,i)=>{


list.innerHTML += `

<tr>

<td>${a.name}</td>

<td>${a.sport}</td>

<td>${a.goal}</td>


<td>

<a style="color:#20b8ff"
href="profile.html?id=${i}">
مشاهده
</a>

</td>


</tr>

`;


});


}


showAthletes();


</script>



</body>

</html>
