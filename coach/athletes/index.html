<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت ورزشکاران | Seven.fitt</title>


<style>

*{
box-sizing:border-box;
font-family:tahoma,Arial;
}

body{
margin:0;
background:#081426;
color:white;
}


.container{
max-width:1100px;
margin:auto;
padding:25px;
}


.header{
background:#102b50;
padding:20px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
}


.logo{
color:#22b8ff;
font-size:28px;
font-weight:bold;
}


.back{
background:#ff5260;
padding:10px 20px;
border-radius:10px;
color:white;
text-decoration:none;
}


.card{

background:#102b50;
padding:25px;
border-radius:20px;
margin-top:25px;

}



.grid{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;

}



label{

color:#9cc8ff;
font-size:13px;

}



input,select,textarea{

width:100%;
padding:12px;
margin-top:8px;

background:#172f52;
color:white;

border:1px solid #315784;
border-radius:10px;

}


textarea{

height:100px;

}



button{

background:#0098df;
color:white;

border:0;
padding:13px 25px;

border-radius:10px;

cursor:pointer;

margin-top:20px;

}



table{

width:100%;
margin-top:20px;
border-collapse:collapse;

}



td,th{

padding:12px;
border-bottom:1px solid #315784;

}



a{

color:#22b8ff;

}



@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

}



</style>


</head>



<body>


<div class="container">



<div class="header">


<div class="logo">
SEVEN.FITT
</div>


<a class="back" href="../index.html">
بازگشت
</a>


</div>






<div class="card">


<h2>
ثبت ورزشکار جدید
</h2>


<div class="grid">


<div>
<label>نام و نام خانوادگی</label>
<input id="name">
</div>



<div>
<label>سن</label>
<input id="age">
</div>



<div>
<label>جنسیت</label>

<select id="gender">

<option>مرد</option>
<option>زن</option>

</select>

</div>




<div>
<label>شماره تماس</label>
<input id="phone">
</div>




<div>
<label>رشته ورزشی</label>

<select id="sport">

<option>فوتبال</option>
<option>بدنسازی</option>
<option>کشتی</option>
<option>رزمی</option>
<option>والیبال</option>
<option>بسکتبال</option>
<option>دوومیدانی</option>
<option>شنا</option>
<option>سایر</option>

</select>

</div>



<div>
<label>سطح ورزشکار</label>

<select id="level">

<option>مبتدی</option>
<option>متوسط</option>
<option>پیشرفته</option>
<option>حرفه‌ای</option>

</select>

</div>




<div>
<label>هدف تمرینی</label>

<select id="goal">

<option>افزایش حجم</option>
<option>کاهش چربی</option>
<option>افزایش قدرت</option>
<option>افزایش سرعت و توان</option>
<option>آمادگی مسابقه</option>
<option>بازتوانی</option>

</select>

</div>



<div>
<label>قد (cm)</label>
<input id="height">
</div>



<div>
<label>وزن (kg)</label>
<input id="weight">
</div>


</div>





<h3>
سابقه تمرینی
</h3>

<textarea id="history"></textarea>




<h3>
وضعیت سلامت و آسیب
</h3>

<textarea id="health"></textarea>




<h3>
یادداشت مربی
</h3>

<textarea id="note"></textarea>




<button onclick="addAthlete()">

+ افزودن ورزشکار

</button>



</div>








<div class="card">


<h2>
لیست ورزشکاران
</h2>


<table>


<thead>

<tr>

<th>نام</th>
<th>رشته</th>
<th>هدف</th>
<th>پروفایل</th>

</tr>

</thead>



<tbody id="list">

</tbody>


</table>


</div>




</div>






<script>


let athletes =
JSON.parse(localStorage.getItem("athletes")) || [];





function addAthlete(){


let athlete={


name:document.getElementById("name").value,

age:document.getElementById("age").value,

gender:document.getElementById("gender").value,


phone:document.getElementById("phone").value,


sport:document.getElementById("sport").value,


level:document.getElementById("level").value,


goal:document.getElementById("goal").value,


height:document.getElementById("height").value,


weight:document.getElementById("weight").value,


history:document.getElementById("history").value,


health:document.getElementById("health").value,


note:document.getElementById("note").value


};




if(!athlete.name){

alert("نام ورزشکار را وارد کنید");

return;

}




athletes.push(athlete);



localStorage.setItem(
"athletes",
JSON.stringify(athletes)
);



showAthletes();



}





function showAthletes(){


let table =
document.getElementById("list");


table.innerHTML="";



athletes.forEach((a,index)=>{


table.innerHTML += `


<tr>


<td>${a.name}</td>


<td>${a.sport}</td>


<td>${a.goal}</td>



<td>

<a href="profile.html?id=${index}">
مشاهده
</a>


</td>



</tr>


`;



});


}



showAthletes();



</script>



</body>

</html>
