</head><body><div class="container"><div class="head"><div><h1>ارزیابی / آزمایشگاه</h1><div class="muted" id="who">در حال بررسی دسترسی...</div></div><div class="nav"><a class="btn soft" href="../index.html">پنل مربی</a><a class="btn soft" href="../../assessment.html">صفحه درخواست عمومی</a><button class="btn danger" id="logout">خروج</button></div></div><div class="toolbar"><button class="btn primary" id="reload">بروزرسانی درخواست‌ها</button><span class="muted" id="count"></span></div><div id="requests" class="requests"><div class="empty">در حال دریافت درخواست‌ها...</div></div></div>
<script>
const root=document.getElementById('requests'),count=document.getElementById('count');let athletes=[];const statusName={REQUESTED:'درخواست جدید',CONTACTED:'تماس گرفته شد',SCHEDULED:'زمان‌بندی شد',COMPLETED:'تست انجام شد',RESULT_DRAFT:'نتیجه پیش‌نویس',RESULT_READY:'نتیجه منتشر شد',CANCELLED:'لغو شد'};const testName={VO2_GAS_ANALYSIS:'VO₂ / آنالیز گازها',WINGATE:'Wingate',BODY_COMPOSITION:'ترکیب بدنی',STRENGTH_1RM:'قدرت / 1RM',JUMP_POWER:'پرش و توان',SPEED_AGILITY:'سرعت و چابکی',OTHER:'سایر'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function faDate(v){if(!v)return '—';try{return new Date(v).toLocaleString('fa-IR')}catch{return '—'}}
function athleteOptions(selected){return '<option value="">انتخاب ورزشکار...</option>'+athletes.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}${a.phone?' — '+esc(a.phone):''}</option>`).join('')}
async function saveStatus(id,el){const card=el.closest('.req'),msg=card.querySelector('.msg');try{await SevenFitt.api('/lab/requests/'+id,{method:'PATCH',body:{status:card.querySelector('[data-status]').value,scheduledAt:card.querySelector('[data-scheduled]').value||null,note:card.querySelector('[data-note]').value}});msg.className='msg';msg.textContent='تغییرات ذخیره شد.';await load()}catch(e){msg.className='msg err';msg.textContent='خطا: '+e.message}}
async function attach(id,el){const card=el.closest('.req'),msg=card.querySelector('.msg'),athleteId=card.querySelector('[data-athlete]').value;if(!athleteId){msg.className='msg err';msg.textContent='ورزشکار را انتخاب کنید.';return}try{await SevenFitt.api('/lab/requests/'+id+'/attach-athlete',{method:'POST',body:{athleteId}});msg.className='msg';msg.textContent='به پروفایل ورزشکار متصل شد.';await load()}catch(e){msg.className='msg err';msg.textContent='خطا: '+e.message}}
async function upload(id,el){const card=el.closest('.req'),msg=card.querySelector('.msg'),file=card.querySelector('[data-file]').files[0];if(!file){msg.className='msg err';msg.textContent='فایل PDF را انتخاب کنید.';return}const fd=new FormData();fd.append('file',file);fd.append('title',card.querySelector('[data-title]').value);fd.append('summary',card.querySelector('[data-summary]').value);try{el.disabled=true;msg.className='msg';msg.textContent='در حال بارگذاری PDF...';await SevenFitt.apiForm('/lab/requests/'+id+'/result',fd);msg.textContent='PDF ذخیره شد؛ برای شاگرد هنوز منتشر نشده است.';await load()}catch(e){msg.className='msg err';msg.textContent='خطا: '+e.message}finally{el.disabled=false}}
async function release(resultId,el){const card=el.closest('.req'),msg=card.querySelector('.msg');if(!confirm('نتیجه برای ورزشکار منتشر شود؟ پس از انتشار، اعلان پیامکی در صف قرار می‌گیرد.'))return;try{el.disabled=true;const out=await SevenFitt.api('/lab/results/'+resultId+'/release',{method:'POST'});msg.className='msg';msg.textContent=out.notificationQueued?'نتیجه منتشر شد و پیامک در صف ارسال قرار گرفت.':'نتیجه منتشر شد؛ شماره معتبر برای پیامک پیدا نشد.';await load()}catch(e){msg.className='msg err';msg.textContent='خطا: '+e.message}finally{el.disabled=false}}
function render(rows){count.textContent=rows.length.toLocaleString('fa-IR')+' درخواست';if(!rows.length){root.innerHTML='<div class="empty">هنوز درخواستی ثبت نشده است.</div>';return}root.innerHTML=rows.map(r=>`<article class="req"><div class="req-top"><div><span class="badge">${esc(testName[r.testType]||r.testType)}</span><h3 style="margin:9px 0 3px">${esc(r.requesterName)}</h3><div class="muted">${esc(r.phone)} · ثبت: ${esc(faDate(r.createdAt))}</div></div><span class="badge">${esc(statusName[r.status]||r.status)}</span></div><div class="grid"><div class="field"><label>وضعیت</label><select data-status>${Object.entries(statusName).map(([k,v])=>`<option value="${k}" ${k===r.status?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>زمان هماهنگ‌شده</label><input data-scheduled type="datetime-local" value="${r.scheduledAt?new Date(r.scheduledAt).toISOString().slice(0,16):''}"></div><div class="field span2"><label>یادداشت هماهنگی</label><textarea data-note>${esc(r.note||'')}</textarea></div></div><div class="toolbar"><button class="btn primary" onclick="saveStatus('${r.id}',this)">ذخیره هماهنگی</button></div><div class="upload"><div class="grid"><div class="field span2"><label>اتصال به پروفایل ورزشکار</label><select data-athlete>${athleteOptions(r.athlete?.id)}</select></div><div class="field"><label>&nbsp;</label><button class="btn soft" style="width:100%" onclick="attach('${r.id}',this)">اتصال به پروفایل</button></div><div class="field"><label>وضعیت اتصال</label><div class="muted">${r.athlete?esc(r.athlete.name)+(r.athlete.userId?' · حساب فعال':' · حساب هنوز متصل نیست'):'هنوز متصل نشده'}</div></div></div>${r.athlete?`<div class="grid"><div class="field"><label>عنوان گزارش</label><input data-title value="${esc(r.result?.title||('نتیجه '+(testName[r.testType]||'ارزیابی')))}"></div><div class="field"><label>فایل PDF (حداکثر ۱۵MB)</label><input data-file type="file" accept="application/pdf,.pdf"></div><div class="field span2"><label>توضیح کوتاه برای پروفایل</label><textarea data-summary></textarea></div></div><div class="toolbar"><button class="btn lime" onclick="upload('${r.id}',this)">${r.result?'جایگزینی PDF پیش‌نویس':'بارگذاری PDF نتیجه'}</button>${r.result&&r.result.status==='DRAFT'?`<button class="btn primary" onclick="release('${r.result.id}',this)">انتشار برای شاگرد + صف پیامک</button>`:''}${r.result&&r.result.status==='RELEASED'?'<span class="badge">منتشر شده ✓</span>':''}</div>`:''}<div class="msg"></div></div></article>`).join('')}
async function load(){try{const [rows,ats]=await Promise.all([SevenFitt.api('/lab/requests'),SevenFitt.api('/lab/athletes')]);athletes=ats;render(rows)}catch(e){root.innerHTML='<div class="empty err">خطا در دریافت اطلاعات: '+esc(e.message)+'</div>'}}
document.getElementById('reload').onclick=load;document.getElementById('logout').onclick=()=>SevenFitt.auth.logout('../login.html');
(async()=>{try{const u=await SevenFitt.auth.requireLabStaff('../login.html');if(!u)return;document.getElementById('who').textContent=((u.firstName||'')+' '+(u.lastName||'')).trim()+' — '+SevenFitt.auth.roleLabel(u.role);await load()}catch(e){root.innerHTML='<div class="empty err">'+esc(e.message)+'</div>'}})();
</script></body></html>
