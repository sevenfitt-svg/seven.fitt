<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت ورزشکاران Seven.fitt</title>

<style>
*{box-sizing:border-box;font-family:tahoma,Arial}

body{
margin:0;
background:#081426;
color:white;
}

.container{
max-width:1200px;
margin:auto;
padding:25px;
}

.header{
background:#102b50;
padding:25px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
color:#22b8ff;
}

.back{
background:#ff4d5a;
padding:10px 20px;
border-radius:10px;
color:white;
text-decoration:none;
}

.card{
background:#102b50;
border:1px solid #244b7a;
border-radius:18px;
padding:25px;
margin-top:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

input,select{
width:100%;
padding:12px;
background:#172d4d;
border:1px solid #315784;
border-radius:10px;
color:white;
}

button{
background:#0098df;
border:0;
color:white;
padding:12px 25px;
border-radius:10px;
cursor:pointer;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

td,th{
padding:15px;
border-bottom:1px solid #315784;
text-align:center;
}

a{
color:#22b8ff;
text-decoration:none;
}

@media(max-width:800px){
.grid{grid-template-columns:1fr}
}

</style>

</head>


<body>

<div class="container">


<div class="header">

<div class="logo">
SEVEN.FITT
</div>

<a class="back" href="../index.html">
بازگشت
</a>

</div>



<div class="card">

<h2>مدیریت ورزشکاران</h2>

<div class="grid">


<input id="name" placeholder="نام ورزشکار">

<input id="age" placeholder="سن">


<select id="sport">

<option>بدون رشته تخصصی</option>
<option>فوتبال</option>
<option>بدنسازی</option>
<option>رزمی</option>
<option>بسکتبال</option>
<option>والیبال</option>
<option>شنا</option>
<option>دو و میدانی</option>

</select>



<select id="goal">

<option>عضله سازی</option>
<option>چربی سوزی</option>
<option>افزایش قدرت</option>
<option>افزایش استقامت</option>
<option>آمادگی جسمانی</option>

</select>


</div>


<br>

<button onclick="addAthlete()">
+ افزودن ورزشکار
</button>


</div>




<div class="card">

<h2>لیست ورزشکاران</h2>


<table>

<thead>

<tr>

<th>نام</th>
<th>سن</th>
<th>رشته</th>
<th>هدف</th>

</tr>

</thead>


<tbody id="list">

</tbody>


</table>


</div>


</div>



<script>


let athletes=[];


function addAthlete(){

let name=document.getElementById("name").value;
let age=document.getElementById("age").value;
let sport=document.getElementById("sport").value;
let goal=document.getElementById("goal").value;


if(!name)return;


athletes.push({
name,
age,
sport,
goal
});


render();

}



function render(){

let html="";


athletes.forEach((a)=>{


html+=`

<tr>

<td>

<a href="profile.html?name=${a.name}&sport=${a.sport}&goal=${a.goal}">

${a.name}

</a>

</td>


<td>${a.age}</td>

<td>${a.sport}</td>

<td>${a.goal}</td>


</tr>

`;


});


document.getElementById("list").innerHTML=html;


}


</script>


</body>
</html>
