<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل ورزشکار | Seven.fitt</title>

<style>

body{
background:#07182d;
color:white;
font-family:tahoma;
margin:0;
padding:30px;
}

.container{
max-width:1100px;
margin:auto;
}

.header{
background:#102d52;
padding:25px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#18b7ff;
font-size:28px;
font-weight:bold;
}

.back{
background:#ff5865;
padding:10px 20px;
border-radius:10px;
color:white;
text-decoration:none;
}


.card{
background:#12345d;
margin-top:20px;
padding:25px;
border-radius:20px;
}


h2{
color:#19b7ff;
}


.grid{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;

}


.item{

background:#183d68;
padding:20px;
border-radius:15px;

}


.label{

color:#8fdcff;
font-size:14px;

}


.value{

font-size:22px;
margin-top:10px;

}


textarea{

width:100%;
height:100px;
background:#102d52;
border:1px solid #24568b;
color:white;
border-radius:10px;
padding:10px;

}


@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

}


</style>

</head>


<body>


<div class="container">


<div class="header">

<a class="back" href="index.html">
بازگشت
</a>

<div class="logo">
SEVEN.FITT
</div>


</div>


<div class="card">

<h2>پروفایل ورزشکار</h2>

<div class="grid">


<div class="item">
<div class="label">نام</div>
<div class="value" id="name">-</div>
</div>


<div class="item">
<div class="label">سن</div>
<div class="value" id="age">-</div>
</div>


<div class="item">
<div class="label">رشته ورزشی</div>
<div class="value" id="sport">-</div>
</div>


<div class="item">
<div class="label">سطح ورزشکار</div>
<div class="value" id="level">-</div>
</div>


<div class="item">
<div class="label">هدف تمرینی</div>
<div class="value" id="goal">-</div>
</div>


<div class="item">
<div class="label">جنسیت</div>
<div class="value" id="gender">-</div>
</div>


</div>

</div>



<div class="card">

<h2>مشخصات بدنی</h2>

<div class="grid">


<div class="item">
<div class="label">قد</div>
<div class="value" id="height">-</div>
</div>


<div class="item">
<div class="label">وزن</div>
<div class="value" id="weight">-</div>
</div>


<div class="item">
<div class="label">BMI</div>
<div class="value" id="bmi">-</div>
</div>


</div>


</div>




<div class="card">

<h2>سابقه تمرینی</h2>

<p id="history">-</p>

</div>




<div class="card">

<h2>وضعیت سلامت و آسیب</h2>

<p id="health">-</p>

</div>




<div class="card">

<h2>یادداشت مربی</h2>

<p id="note">-</p>

</div>



</div>



<script>


let id=new URLSearchParams(location.search).get("id");


let athletes=JSON.parse(localStorage.getItem("athletes")) || [];


let athlete=athletes[id];



if(athlete){


document.getElementById("name").innerHTML=athlete.name || "-";

document.getElementById("age").innerHTML=athlete.age || "-";

document.getElementById("sport").innerHTML=athlete.sport || "-";

document.getElementById("level").innerHTML=athlete.level || "-";

document.getElementById("goal").innerHTML=athlete.goal || "-";

document.getElementById("gender").innerHTML=athlete.gender || "-";


document.getElementById("height").innerHTML=(athlete.height || "-")+" cm";

document.getElementById("weight").innerHTML=(athlete.weight || "-")+" kg";


if(athlete.height && athlete.weight){

let h=athlete.height/100;

document.getElementById("bmi").innerHTML=(athlete.weight/(h*h)).toFixed(1);

}


document.getElementById("history").innerHTML=athlete.history || "-";

document.getElementById("health").innerHTML=athlete.health || "-";

document.getElementById("note").innerHTML=athlete.note || "-";


}


</script>


</body>

</html>
